<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>NAMU 학원관리</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <section id="auth-screen" class="auth-screen" aria-live="polite"></section>
  <div class="app-shell hidden" id="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark">N</span><span><b>NAMU</b><small>ACADEMY MANAGER</small></span></a>
      <div class="school-switch"><span class="school-avatar">N</span><span><b>NAMU 학원</b><small>원장님 계정</small></span><span class="chevron">⌄</span></div>
      <nav class="nav" aria-label="주 메뉴">
        <p class="nav-label">WORKSPACE</p>
        <a href="#dashboard" data-page="dashboard" class="nav-item active"><span>◫</span> 대시보드</a>
        <a href="#students" data-page="students" class="nav-item"><span>♙</span> 수강생 관리 <em id="nav-students">0</em></a>
        <a href="#payments" data-page="payments" class="nav-item"><span>₩</span> 수납 관리 <i id="nav-unpaid">0</i></a>
        <a href="#ledger" data-page="ledger" class="nav-item"><span>▤</span> 학원 가계부</a>
        <a href="#consultations" data-page="consultations" class="nav-item"><span>▧</span> 상담 관리</a>
        <p class="nav-label nav-spacer">관리</p>
        <a href="#settings" data-page="settings" class="nav-item"><span>⚙</span> 설정 및 데이터</a>
      </nav>
      <div class="sidebar-bottom"><div class="help-card"><span>✦</span><b>학원 운영을 더 간편하게</b><p>기본 정보와 장부를 한곳에서 관리하세요.</p></div><div class="profile"><div class="profile-avatar" id="profile-avatar">원</div><span><b id="profile-name">원장님</b><small id="profile-role">원장</small></span><button title="로그아웃" data-action="logout">↪</button></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>NAMU 학원</span><span class="slash">/</span><b id="crumb">대시보드</b></div><div class="top-actions"><select id="branch-select" class="branch-select" aria-label="사용 지점 선택" hidden></select><span class="today" id="today"></span><span class="signed-in-user" id="signed-in-user"></span><button class="icon-button" aria-label="알림">♧<i class="notification-dot"></i></button><div class="top-avatar" id="top-avatar">원</div></div></header>
      <section class="page-content" id="page-content"></section>
      <footer>NAMU 학원관리 <span>·</span> 학원 데이터는 지점별로 분리되어 저장됩니다.</footer>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="restore-file" accept=".namu,application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
